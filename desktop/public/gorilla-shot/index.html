<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Gorilla Shot</title>
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <canvas id="c" width="320" height="180" aria-label="Gorilla Shot arena"></canvas>
    <code id="a" aria-live="off"></code>
    <div id="shot-loading" class="shot-loading" role="status" aria-live="polite">
      <div class="shot-loading-panel">
        <div class="shot-overlay-brand"><span class="shot-brand-mark">GP</span><span class="shot-overline">GORILLAPUNCH ARCADE</span></div>
        <span class="shot-loading-ring" aria-hidden="true"></span>
        <strong id="shot-loading-title">BOOTING THE ARENA</strong>
        <span id="shot-loading-step">Loading game systems…</span>
        <div class="shot-loading-meter"><span id="shot-loading-progress"></span></div>
      </div>
    </div>
    <div id="shot-overlay" class="shot-overlay" hidden>
      <div class="shot-overlay-panel">
        <div class="shot-overlay-brand"><span class="shot-brand-mark">GP</span><span class="shot-overline">GORILLAPUNCH ARCADE</span><span class="shot-ready-chip">READY</span></div>
        <span class="shot-mission-label">SECTOR SURVIVAL</span>
        <h1 id="shot-heading">GORILLA SHOT</h1>
        <p id="shot-message">Reboot the satellite systems and clear the arena to survive.</p>
        <div class="shot-control-grid" aria-label="Game controls">
          <div><kbd>WASD</kbd><span id="shot-move-label">MOVE</span></div>
          <div><kbd>MOUSE</kbd><span id="shot-aim-label">AIM</span></div>
          <div><kbd>HOLD CLICK</kbd><span id="shot-fire-label">FIRE</span></div>
          <div><kbd>P / ESC</kbd><span id="shot-pause-label">PAUSE</span></div>
        </div>
        <button id="shot-start" type="button">Deploy to Sector 1</button>
        <span id="shot-note" class="shot-overlay-note">Clear the systems. Your mission progress is saved.</span>
      </div>
    </div>
    <script src="dom.js"></script>
    <script src="source/game.js"></script>
    <script src="source/random.js"></script>
    <script src="source/renderer.js"></script>
    <script src="source/entity.js"></script>
    <script src="source/entity-cpu.js"></script>
    <script src="source/entity-player.js"></script>
    <script src="source/entity-plasma.js"></script>
    <script src="source/entity-spider.js"></script>
    <script src="source/entity-sentry.js"></script>
    <script src="source/entity-particle.js"></script>
    <script src="source/entity-health.js"></script>
    <script src="source/entity-explosion.js"></script>
    <script src="source/sonantx-reduced.js"></script>
    <script src="source/music-dark-meat-beat.js"></script>
    <script src="source/sound-effects.js"></script>
    <script src="source/audio.js"></script>
    <script src="source/terminal.js"></script>
    <script src="shot.js"></script>
  </body>
</html>
